# The claim this port has to earn is "it computes the same thing as the Java
# original" - and the golden-master suite in elamx-core/core/tests/ is what
# earns it. That suite compares against numbers checked into the repo
# (reference.txt, produced by eLamX 3.x), so it needs no Java installation and
# runs here exactly as it runs locally. It is the reason this workflow exists;
# the rest is the ordinary "does it still build" scaffolding around it.
#
# The frontend suite (`npm test`, vitest) runs beside them: it covers the
# arithmetic and state the browser tests cannot pin down cheaply - stacking
# notation, number formatting, unit round-trips, the store's migrations.
#
# Clippy IS run, with `-D warnings`, and so is the frontend's linter (oxlint
# `--deny-warnings`, since oxlint reports most of what it finds as warnings and
# would otherwise exit 0 on them). The transcribed constants in
# plate/boundary_tables.rs trip clippy::approx_constant by design - they are
# the Java tables' literals, kept literal so they can be diffed against the
# source - and the allowances that settle that carry their reasoning.
#
# Deliberately absent: `cargo fmt --check`. It does not pass, and not only
# because rustfmt would reflow those hand-aligned tables: they account for 6 of
# the 572 places it would rewrite, the rest being ordinary drift. Enabling it
# means one reformatting commit across the core (`#[rustfmt::skip]` on the
# tables, as cutout/geometry.rs already uses), which is a decision to take
# deliberately rather than under a red build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer irrelevant.
# Read-only unless a job says otherwise: `npm ci` runs install scripts of
# every dependency, and what they can do with the token should not depend on
# a repository setting.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keyed by the lockfile: a dependency bump starts from a cold cache
      # rather than from a stale one.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            elamx-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('elamx-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Clippy was not run anywhere, and had drifted into failing: 17 errors,
      # all of them the tabulated eLamX constants being read as sloppy
      # approximations of pi. The allowances that settle those carry their
      # reasoning; from here a new warning fails the build rather than piling
      # up unseen.
      - name: cargo clippy
        working-directory: elamx-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: elamx-core
        run: cargo test --workspace --locked

      # web/src/lib/generated/ is written by ts-rs from the Rust structs and
      # committed, so the frontend builds without a Rust toolchain. This step
      # is what keeps the two honest: regenerate, and fail if anything moved.
      # Without it a renamed serde field would compile on both sides and turn
      # up as an `undefined` at runtime.
      - name: TypeScript bindings are up to date
        working-directory: elamx-core
        run: |
          cargo test --workspace --locked --features ts
          git diff --exit-code -- ../web/src/lib/generated

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            elamx-core/target
          key: wasm-${{ runner.os }}-${{ hashFiles('elamx-core/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      # A fixed release, checked against its published digest, rather than
      # `curl ... | sh` of an installer script: what builds the shipped wasm
      # should be the same bytes every run. The project moved from rustwasm to
      # wasm-bindgen; the old installer URL still answers, with 0.13.1.
      - name: Install wasm toolchain
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          rustup target add wasm32-unknown-unknown
          archive="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${archive}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum --check
          tar xzf wasm-pack.tar.gz
          install -m 755 "${archive}/wasm-pack" ~/.cargo/bin/wasm-pack
          rm -rf wasm-pack.tar.gz "${archive}"

      # web/src/wasm-pkg/ is gitignored, so the frontend cannot typecheck
      # before this step has run - which also means this workflow exercises the
      # exact build command the README documents.
      - name: Build the WASM core
        working-directory: elamx-core/wasm
        run: wasm-pack build --target web --out-dir ../../web/src/wasm-pkg -- --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      # `npm run build` is `tsc -b && vite build`: the typecheck is part of it,
      # so there is no separate typecheck step.
      - name: Typecheck and build
        working-directory: web
        run: npm run build
