[package]
name = "elamx-core"
version = "0.1.0"
edition = "2021"
description = "Classical laminate theory calculation core for eLamX (Rust rewrite of the Java calculation engine)"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
uuid = { version = "1", features = ["v4", "serde", "js"] }
# Only ever enabled by the `ts` feature, which only the type-export test turns
# on - the wasm binary never sees it.
ts-rs = { version = "12", optional = true }

[features]
# Emits the TypeScript definitions of every type that crosses the wasm
# boundary. See core/tests/typescript_bindings.rs.
ts = ["dep:ts-rs"]

[dev-dependencies]
approx = "0.5"

[lints]
workspace = true
