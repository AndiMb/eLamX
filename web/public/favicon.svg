<!-- Dieselbe Marke wie die Topbar (siehe LogoMark in TopBar.tsx): drei
     versetzte Parallelogramme als Lagenstapel. Bewusst KEINE gleich breiten
     Balken - die laesen sich als Hamburger-Menue. Der Farbwert ist der Akzent
     des hellen Themes; ein Favicon kann das Theme des Betrachters nicht
     kennen, und Blau haelt auf hellem wie dunklem Tab-Hintergrund. -->
