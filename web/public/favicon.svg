  <path d="M6 8.4 L18 8.4 L14 12.6 L2 12.6 Z" fill="#1a56db" opacity="0.65" />
  <path d="M6 13.8 L18 13.8 L14 18 L2 18 Z" fill="#1a56db" opacity="0.38" />
</svg>
